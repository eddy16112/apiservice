[metadata]
name = codex-json-llm
version = 0.1.0
description = Forward questions to Codex CLI and expose OpenAI-compatible JSON.
long_description = file: README.md
long_description_content_type = text/markdown
author = apiservice

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    llm = codex_json_cli.cli:main
    llm-api = codex_json_cli.server:main
    llm-telegram = codex_json_cli.telegram_bridge:main
    llm-whatsapp = codex_json_cli.whatsapp_bridge:main
