[metadata]
name = codex-json-llm
version = 0.1.0
description = Forward questions to Codex CLI and wrap the final answer as JSON.
long_description = file: README.md
long_description_content_type = text/markdown
author = apiservice

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    llm = codex_json_cli.cli:main
